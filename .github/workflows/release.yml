name: Release

# Builds the extension for every supported browser engine and attaches the
# packages to a GitHub Release.
#
# Firefox note: a raw ZIP is NOT installable in release/stable Firefox — it
# refuses unsigned add-ons with the misleading error "this add-on appears to
# be corrupt". To produce an installable file we submit the Firefox build to
# Mozilla's signing API (`web-ext sign --channel=unlisted`) and attach the
# resulting **signed .xpi**. This requires two repository secrets:
#   * WEB_EXT_API_KEY    -> AMO API "JWT issuer"
#   * WEB_EXT_API_SECRET -> AMO API "JWT secret"
# Generate them at https://addons.mozilla.org/developers/addon/api/key/
# If the secrets are absent the workflow still succeeds and ships the unsigned
# ZIP (useful for AMO upload or about:debugging), but signing is skipped.
#
# Triggers:
#   * pushing a tag like `v20.1.0`  -> builds + publishes a release
#   * manual run (workflow_dispatch) -> builds + uploads artifacts only

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Optional release name (manual runs only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Build extension
        run: npm run build:${{ matrix.browser }}:prod

      - name: Package extension
        run: npm run release:${{ matrix.browser }}

      - name: Normalize artifact names
        run: |
          mkdir -p artifacts
          VERSION=$(node -p "require('./package.json').version")
          for f in releases/${{ matrix.browser }}/*.zip; do
            [ -e "$f" ] || continue
            cp "$f" "artifacts/censortracker-${{ matrix.browser }}-v${VERSION}.zip"
          done
          ls -la artifacts

      # Submit the Firefox build to Mozilla for signing so the released file can
      # actually be installed in stable Firefox. Skipped (without failing the
      # run) when AMO credentials are not configured.
      - name: Sign Firefox add-on (Mozilla, unlisted)
        if: matrix.browser == 'firefox'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          mkdir -p artifacts
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::warning title=Firefox add-on not signed::WEB_EXT_API_KEY / WEB_EXT_API_SECRET secrets are not set. Shipping the unsigned .zip only — it cannot be installed in release Firefox. See https://addons.mozilla.org/developers/addon/api/key/"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          npx web-ext sign \
            --source-dir=./dist/firefox/prod \
            --artifacts-dir=./releases/firefox \
            --channel=unlisted \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET"
          for f in releases/firefox/*.xpi; do
            [ -e "$f" ] || continue
            cp "$f" "artifacts/censortracker-firefox-v${VERSION}.xpi"
          done
          ls -la artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: censortracker-${{ matrix.browser }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a release when the run was triggered by a version tag.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Collect packages
        run: |
          mkdir -p release-assets
          find dist-artifacts \( -name '*.zip' -o -name '*.xpi' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
