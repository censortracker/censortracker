name: Release

# Builds the extension for every supported browser engine and attaches the
# packages to a GitHub Release — all in a single job.
#
# Everything happens on one runner on purpose: a split build/publish pair has
# to hand packages over through upload-artifact/download-artifact and a
# `needs:` edge, which means a transient runner hiccup in the build job leaves
# the publish job silently `skipped` and no release gets created. One job has
# one outcome, and re-running it re-runs the whole thing.
#
# Firefox note: a raw ZIP is NOT installable in release/stable Firefox — it
# refuses unsigned add-ons with the misleading error "this add-on appears to
# be corrupt". To produce an installable file we submit the Firefox build to
# Mozilla's signing API (`web-ext sign --channel=unlisted`) and attach the
# resulting **signed .xpi**. This requires two repository secrets:
#   * WEB_EXT_API_KEY    -> AMO API "JWT issuer"
#   * WEB_EXT_API_SECRET -> AMO API "JWT secret"
# Generate them at https://addons.mozilla.org/developers/addon/api/key/
# If the secrets are absent the workflow still succeeds and ships the unsigned
# ZIP (useful for AMO upload or about:debugging), but signing is skipped.
#
# Triggers:
#   * pushing a tag like `v20.1.0`   -> builds + publishes a release
#   * manual run on a tag            -> same, useful to retry a failed release
#   * manual run on a branch         -> builds + uploads artifacts only

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Build & package every browser
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          for browser in chrome firefox; do
            npm run "build:${browser}:prod"
            npm run "release:${browser}"
            for f in "releases/${browser}"/*.zip; do
              [ -e "$f" ] || continue
              cp "$f" "release-assets/censortracker-${browser}-v${VERSION}.zip"
            done
          done
          ls -la release-assets

      # Submit the Firefox build to Mozilla for signing so the released file can
      # actually be installed in stable Firefox. Skipped (without failing the
      # run) when AMO credentials are not configured.
      - name: Sign Firefox add-on (Mozilla, unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_EXT_API_KEY:-}" ] || [ -z "${WEB_EXT_API_SECRET:-}" ]; then
            echo "::warning title=Firefox add-on not signed::WEB_EXT_API_KEY / WEB_EXT_API_SECRET secrets are not set. Shipping the unsigned .zip only — it cannot be installed in release Firefox. See https://addons.mozilla.org/developers/addon/api/key/"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          npx web-ext sign \
            --source-dir=./dist/firefox/prod \
            --artifacts-dir=./releases/firefox \
            --channel=unlisted \
            --api-key="${WEB_EXT_API_KEY}" \
            --api-secret="${WEB_EXT_API_SECRET}"
          for f in releases/firefox/*.xpi; do
            [ -e "$f" ] || continue
            cp "$f" "release-assets/censortracker-firefox-v${VERSION}.xpi"
          done
          ls -la release-assets

      # Keeps the packages downloadable from the run itself, which is the only
      # way to get them out of a manual run on a branch (no tag -> no release).
      - name: Upload packages as run artifacts
        uses: actions/upload-artifact@v7
        with:
          name: censortracker-packages
          path: release-assets/*
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
