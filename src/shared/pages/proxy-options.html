<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8"/>
  <title data-i18n-key="optionsProxyPageTitle"></title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/options.css"/>
</head>

<body>
<div class="main-container">
  <div class="main-page main-page--wide">
    <div class="main-page__image">
      <a href="options.html">
        <img src="../images/settings/quokka.png" width="200" height="auto" alt="Censor Tracker Logo"/>
      </a>
    </div>
    <div class="main-page__info">
      <div class="main-page__return">
        <a class="return-link" href="options.html">
          <svg width="24" height="16" viewBox="0 0 24 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M1.46967 7.46967C1.17678 7.76256 1.17678 8.23744 1.46967 8.53033L6.24264 13.3033C6.53553 13.5962 7.01041 13.5962 7.3033 13.3033C7.59619 13.0104 7.59619 12.5355 7.3033 12.2426L3.06066 8L7.3033 3.75736C7.59619 3.46447 7.59619 2.98959 7.3033 2.6967C7.01041 2.40381 6.53553 2.40381 6.24264 2.6967L1.46967 7.46967ZM22 7.25L2 7.25V8.75L22 8.75V7.25Z"/>
          </svg>
        </a>
      </div>
      <div class="main-page__title page-main-title" data-i18n-key="proxySettings"></div>

      <div id="proxyIsDown" class="proxy__disclaimer" hidden>
        <div data-i18n-key="proxyOptionsStatusTitle" class="disclaimer__title"></div>
        <div data-i18n-key="proxyOptionsStatusDesc" class="disclaimer__text"></div>
      </div>

      <div class="checkbox__group">
        <div class="main-page__turn">
          <label for="useProxyCheckbox" class="toggle-text" data-i18n-key="useProxy"></label>
          <input id="useProxyCheckbox" type="checkbox" class="toggle-button">
        </div>
        <div class="main-page__about">
          <div class="use_proxy__text" data-i18n-key="optionsProxyDesc"></div>
        </div>

        <div id="proxyCustomOptions" hidden>
          <div class="current-proxy-address" id="currentProxyAddress" hidden>
            <span class="current-proxy-address__label" data-i18n-key="currentProxyLabel"></span>
            <code class="current-proxy-address__value" id="currentProxyAddressValue"></code>
          </div>

          <label class="cproxy-toolbar__check proxy-all-traffic">
            <input type="checkbox" id="proxyAllTraffic"/>
            <span data-i18n-key="proxyAllTrafficLabel"></span>
          </label>
          <div class="cproxy-hint proxy-all-traffic__hint" id="emptyRegistryHint" hidden
               data-i18n-key="emptyRegistryHint"></div>

          <div id="proxyCustomOptionsRadioGroup" class="radio-buttons-group">
            <div class="radio-button">
              <input id="useDefaultProxy" class="radio-button-input" type="radio" name="proxy-radio" value="default"
                     checked>
              <label class="radio-button-label" for="useDefaultProxy" data-i18n-key="useDefaultProxy"></label>
            </div>
            <div class="radio-button">
              <input class="radio-button-input" type="radio" name="proxy-radio" id="useCustomProxy" value="custom">
              <label class="radio-button-label" for="useCustomProxy" data-i18n-key="useOwnProxy"></label>
            </div>
            <div id="proxyOptionsInputs" class="proxy-options-inputs hidden">
              <!-- Unified list: built-in (backend) + user proxies. Tick the
                   ones to chain (tried one after another), edit or delete. -->
              <div class="cproxy-hint" data-i18n-key="proxyChainHint"></div>

              <button type="button" class="cproxy-section__head" id="proxyListToggle" aria-expanded="true">
                <svg class="cproxy-chevron cproxy-chevron--open" width="14" height="14" viewBox="0 0 24 24"
                     fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="cproxy-section__title" data-i18n-key="myProxiesTitle"></span>
                <span class="cproxy-count" id="proxyCount"></span>
              </button>
              <div id="proxyListBody">
                <div class="custom-proxy-list" id="customProxyList"></div>
              </div>

              <div class="cproxy-toolbar">
                <button type="button" class="btn btn-dark cproxy-toolbar__btn" id="testAllProxiesButton">
                  <span class="btn__text" data-i18n-key="testProxiesButton"></span>
                </button>
                <button type="button" class="btn cproxy-toolbar__btn hidden" id="stopTestProxiesButton">
                  <span class="btn__text" data-i18n-key="stopTestProxiesButton"></span>
                </button>
                <button type="button" class="btn cproxy-toolbar__btn" id="removeDeadProxiesButton">
                  <span class="btn__text" data-i18n-key="removeDeadProxiesButton"></span>
                </button>
                <button type="button" class="btn cproxy-toolbar__btn" id="removeUntestedProxiesButton">
                  <span class="btn__text" data-i18n-key="removeUntestedProxiesButton"></span>
                </button>
                <button type="button" class="btn cproxy-toolbar__btn" id="removeUncheckedProxiesButton">
                  <span class="btn__text" data-i18n-key="removeUncheckedProxiesButton"></span>
                </button>
                <button type="button" class="btn cproxy-toolbar__btn" id="removeAllProxiesButton">
                  <span class="btn__text" data-i18n-key="removeAllProxiesButton"></span>
                </button>
                <button type="button" class="btn cproxy-toolbar__btn" id="pasteProxiesButton">
                  <span class="btn__text" data-i18n-key="pasteProxiesButton"></span>
                </button>
                <button type="button" class="btn cproxy-toolbar__btn" id="copyAllProxiesButton">
                  <span class="btn__text" data-i18n-key="copyAllProxiesButton"></span>
                </button>
                <label class="cproxy-toolbar__field">
                  <span data-i18n-key="proxyTestTargetLabel"></span>
                  <select id="proxyTestTarget" class="cproxy-select">
                    <option value="google">Google</option>
                    <option value="cloudflare">Cloudflare</option>
                    <option value="amazon">Amazon</option>
                    <option value="azure">Azure</option>
                  </select>
                </label>
                <label class="cproxy-toolbar__field cproxy-toolbar__check">
                  <input type="checkbox" id="autoDeleteDeadProxies"/>
                  <span data-i18n-key="autoDeleteDeadProxiesLabel"></span>
                </label>
              </div>
              <div class="cproxy-progress hidden" id="checkProgress">
                <div class="cproxy-progress__bar">
                  <div class="cproxy-progress__fill" id="checkProgressFill"></div>
                </div>
                <div class="cproxy-progress__text" id="checkProgressText"></div>
              </div>
              <div class="cproxy-import-msg" id="proxyImportMsg" hidden></div>

              <div class="cproxy-sources">
                <button type="button" class="cproxy-section__head" id="countryFilterToggle" aria-expanded="false">
                  <svg class="cproxy-chevron" width="14" height="14" viewBox="0 0 24 24"
                       fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span class="cproxy-section__title" data-i18n-key="countryFilterTitle"></span>
                  <span class="cproxy-count" id="countryFilterSummary"></span>
                </button>
                <div id="countryFilterBody" class="hidden">
                  <div class="cproxy-hint" data-i18n-key="countryFilterHint"></div>

                  <div class="cproxy-sources__row">
                    <button type="button" class="btn btn-dark cproxy-toolbar__btn" id="detectCountriesButton">
                      <span class="btn__text" data-i18n-key="detectCountriesButton"></span>
                    </button>
                    <span class="cproxy-sources__status" id="countryDetectStatus"></span>
                  </div>

                  <div class="cproxy-sources__row">
                    <label class="cproxy-toolbar__field">
                      <span data-i18n-key="countryFilterModeLabel"></span>
                      <select id="countryFilterMode" class="cproxy-select">
                        <option value="off" data-i18n-key="countryFilterModeOff"></option>
                        <option value="block" data-i18n-key="countryFilterModeBlock"></option>
                        <option value="allow" data-i18n-key="countryFilterModeAllow"></option>
                      </select>
                    </label>
                    <label class="cproxy-toolbar__field cproxy-country-filter__field">
                      <span data-i18n-key="countryFilterListLabel"></span>
                      <input type="text" id="countryFilterList" class="cproxy-country-filter__input"
                             list="detectedCountriesList" placeholder="RU, CN, IR" autocomplete="off"/>
                    </label>
                    <datalist id="detectedCountriesList"></datalist>
                  </div>

                  <div class="cproxy-sources__row">
                    <label class="cproxy-toolbar__check">
                      <input type="checkbox" id="countryFilterAuto"/>
                      <span data-i18n-key="countryFilterAutoLabel"></span>
                    </label>
                    <label class="cproxy-toolbar__check">
                      <input type="checkbox" id="countryFilterUnknown"/>
                      <span data-i18n-key="countryFilterUnknownLabel"></span>
                    </label>
                    <button type="button" class="btn cproxy-toolbar__btn" id="applyCountryFilterButton">
                      <span class="btn__text" data-i18n-key="applyCountryFilterButton"></span>
                    </button>
                  </div>

                  <div class="cproxy-sources__row">
                    <label class="cproxy-toolbar__field">
                      <span data-i18n-key="keepOnlyCountryLabel"></span>
                      <select id="keepOnlyCountry" class="cproxy-select"></select>
                    </label>
                    <button type="button" class="btn cproxy-toolbar__btn" id="keepOnlyCountryButton">
                      <span class="btn__text" data-i18n-key="keepOnlyCountryButton"></span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="cproxy-sources">
                <button type="button" class="cproxy-section__head" id="proxySourcesToggle" aria-expanded="false">
                  <svg class="cproxy-chevron" width="14" height="14" viewBox="0 0 24 24"
                       fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span class="cproxy-section__title" data-i18n-key="proxySourcesTitle"></span>
                </button>
                <div id="proxySourcesBody" class="hidden">
                <label class="cproxy-toolbar__check">
                  <input type="checkbox" id="proxySourcesEnabled"/>
                  <span data-i18n-key="proxySourcesEnabledLabel"></span>
                </label>
                <div class="cproxy-hint" data-i18n-key="proxySourcesHint"></div>
                <div class="cproxy-sources__row">
                  <label class="cproxy-toolbar__field cproxy-sources__preset">
                    <span data-i18n-key="recommendedSourcesLabel"></span>
                    <select id="proxySourcesPreset" class="cproxy-select"></select>
                  </label>
                  <button type="button" class="btn cproxy-toolbar__btn" id="addProxySourcePreset">
                    <span class="btn__text" data-i18n-key="addSourceButton"></span>
                  </button>
                </div>
                <textarea id="proxySourcesList" class="cproxy-sources__textarea"
                          placeholder="https://example.com/proxies.txt"></textarea>
                <div class="cproxy-sources__row">
                  <label class="cproxy-toolbar__field">
                    <span data-i18n-key="proxySourcesIntervalLabel"></span>
                    <input type="number" id="proxySourcesInterval" class="cproxy-sources__interval"
                           min="5" step="5"/>
                  </label>
                  <label class="cproxy-toolbar__check">
                    <input type="checkbox" id="proxySourcesUseProxy"/>
                    <span data-i18n-key="proxySourcesUseProxyLabel"></span>
                  </label>
                  <label class="cproxy-toolbar__check">
                    <input type="checkbox" id="proxySourcesAutoTest"/>
                    <span data-i18n-key="proxySourcesAutoTestLabel"></span>
                  </label>
                </div>
                <div class="cproxy-sources__row">
                  <button type="button" class="btn btn-dark cproxy-toolbar__btn" id="fetchProxySourcesButton">
                    <span class="btn__text" data-i18n-key="fetchProxySourcesButton"></span>
                  </button>
                  <span class="cproxy-sources__status" id="proxySourcesStatus"></span>
                </div>
                </div>
              </div>

              <div class="custom-proxy-form">
                <div class="custom-proxy-form__title" id="customProxyFormTitle"
                     data-i18n-key="addCustomProxyTitle"></div>

                <div class="select" id="selectProxyProtocol">
                  <button type="button" class="select-toggle" id="select-toggle">
                    HTTPS
                  </button>
                  <div class="select-dropdown">
                    <ul class="select-options">
                      <li class="select-option" data-value="SOCKS4">SOCKS4</li>
                      <li class="select-option" data-value="SOCKS5">SOCKS5</li>
                      <li class="select-option" data-value="HTTP">HTTP</li>
                      <li class="select-option" data-value="HTTPS">HTTPS</li>
                    </ul>
                  </div>
                </div>

                <input type="text"
                       id="proxyNameInput"
                       class="input-proxy"
                       placeholder="Name (optional)">

                <input type="text"
                       id="proxyServerInput"
                       class="input-proxy"
                       placeholder="socks5://[username:password@]hostname:port">

                <div class="custom-proxy-form__actions">
                  <button class="btn btn-dark" id="saveCustomProxyButton">
                    <span class="btn__text" data-i18n-key="addCustomProxyButton"></span>
                  </button>
                  <button class="btn hidden" id="cancelEditProxyButton">
                    <span class="btn__text" data-i18n-key="cancel"></span>
                  </button>
                </div>

                <div class="hidden invalid-proxy-msg" id="invalidCustomProxy"
                     data-i18n-key="invalidCustomProxy"></div>
              </div>
            </div>

            <div class="radio-button">
              <input class="radio-button-input" type="radio" name="proxy-radio" id="useLocalProxy" value="local">
              <label class="radio-button-label" for="useLocalProxy" data-i18n-key="useLocalProxy"></label>
              <button class="btn btn-dark btn__addLocalProxy" id="addLocalProxyButton">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M4.16406 10.0001H15.8307M9.9974 4.16675V15.8334" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="btn__text" data-i18n-key="addLocalProxyButton"></span>
              </button>
            </div>

            <div class="block_custom-local-proxy" id="localProxyOptions">

              <div class="censortracker-not-found__wrapper hidden" id="localProxyClientNotFound">
                <div><b data-i18n-key="localProxyNotFoundTitle"></b></div>
                <div data-i18n-key="localProxyNotFoundDesc"></div>
                <button class="btn btn__censortracker-not-found" id="downloadLocalProxyButton">
                  <span class="btn__text" data-i18n-key="downloadAppButton"></span>
                </button>
              </div>

              <div class="loading-dots" id="loading">
                <div></div>
                <div></div>
                <div></div>
              </div>

              <div class="add-proxy__wrapper hidden" id="rksVPNBanner">
                <div class="add-proxy__inner">
                  <div>
                    <b data-i18n-key="rksVPNBannerTitle"></b>
                  </div>
                  <div data-i18n-key="rksVPNBannerDesc"></div>
                </div>
                <div class="rks-vpn__wrapper">
                  <img class="rks-vpn__logo" src="../images/settings/rks_logo.svg" width="166" height="auto"
                       alt="RKS VPN"/>
                  <div class="rks-vpn__title" data-i18n-key="rksVPNBannerDesc2"></div>
                  <div class="rks-vpn__text" data-i18n-key="rksVPNBannerDesc3"></div>
                  <a class="btn btn-dark btn__rks-vpn" href="https://storage.googleapis.com/plmrph/ee5cbfj0"
                     target="_blank">
                    <span class="btn__text" data-i18n-key="rksVPNBannerLinkTitle"></span>
                  </a>
                </div>
              </div>

              <div class="proxy-list__wrapper" id="changeLocalProxyRadio"></div>
              <div class="proxy-list__block__popup proxy-list__block__popup-add-proxy" id="addLocalProxyPopup">
                <div class="popup-add-proxy__btn-close" id="closeLocalProxyPopup">
                  <img src="../images/settings/close_icon.svg" width="44" height="44" alt=""/></div>
                <div class="popup-add-proxy__inner">
                  <div class="popup-add-proxy__title" data-i18n-key="localProxyPopupTitle"></div>
                  <div data-i18n-key="localProxyPopupCode"></div>
                  <textarea id="localProxyTextarea" placeholder="vless://..."></textarea>
                  <div class="hidden" id="invalidLocalProxyConfig" data-i18n-key="invalidLocalProxyConfig"></div>
                  <div class="popup-add-proxy__text" data-i18n-key="localProxyPopupText"></div>
                  <div class="popup-add-proxy__btns">
                    <button class="btn btn-dark" id="addLocalProxyConfigButton">
                      <span class="btn__text" data-i18n-key="addLocalProxyButton"></span>
                    </button>
                    <button class="btn" id="goBackLocalProxy">
                      <span class="btn__text" data-i18n-key="cancel"></span>
                    </button>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>

        <div id="controlledByOtherExtension" class="main-page__extension" hidden>
          <div class="extension__title" data-i18n-key="controlledByOtherExtensionTitle"
               data-i18n-render-prop="extensionName">
          </div>
          <div class="extension__text" data-i18n-key="controlledByOtherExtensionDesc"
               data-i18n-render-prop="extensionName">
          </div>
          <a class="default-btn disable-other-extensions" data-i18n-key="disableAll"></a>
        </div>

        <div id="controlledByOtherExtensions" class="main-page__extension" hidden>
          <div class="extension__title" data-i18n-key="controlledByOtherExtensions"></div>
          <div class="extension__text">
            <div data-i18n-key="controlledByOtherExtensionsDesc"></div>
            <ol id="extensionsWhichControlsProxy">
            </ol>
          </div>
          <a class="default-btn disable-other-extensions" data-i18n-key="disableAll"></a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
